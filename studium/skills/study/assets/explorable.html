<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poles and step response of a mass-spring-damper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    }
  }
  body { margin: 0; background: var(--surface); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .lede { color: var(--text-2); margin: 0 0 16px; }
  .predict { border-left: 3px solid var(--series-2); padding: 8px 12px; margin: 0 0 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-bottom: 8px; }
  .controls label { display: grid; gap: 2px; min-width: 240px; flex: 1; color: var(--text-2); }
  .controls output { color: var(--text); font-variant-numeric: tabular-nums; }
  .controls input { width: 100%; accent-color: var(--series-1); }
  .readout { font-variant-numeric: tabular-nums; margin: 8px 0 16px; min-height: 1.5em; }
  .plots { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  .plot { height: 380px; }
  figcaption { color: var(--text-2); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <!-- Replace the text, PARAMS, model() and draw() for the idea being taught. -->
  <h1>Poles and step response of a mass-spring-damper</h1>
  <p class="lede">m = 1, k = 1. The damping d moves the poles; the poles decide how the step response behaves.</p>
  <p class="predict"><strong>Predict first.</strong> Before you touch the slider: where are the poles when d = 0, and what does the response do when d goes below 0?</p>

  <section class="controls" id="controls"></section>
  <p class="readout" id="readout"></p>

  <section class="plots">
    <figure><div class="plot" id="plot-a"></div><figcaption>Poles in the complex plane. Left of the imaginary axis means Re &lt; 0.</figcaption></figure>
    <figure><div class="plot" id="plot-b"></div><figcaption>Position after a unit step in the force, starting at rest.</figcaption></figure>
  </section>
</main>

<script>
// One entry per slider.
const PARAMS = [
  { id: "d", label: "damping d", min: -0.6, max: 3, step: 0.02, value: 1 },
];

// The mathematics. Returns everything draw() needs for one setting of the sliders.
function model({ d }) {
  const disc = d * d - 4;
  const poles = disc >= 0
    ? [[(-d + Math.sqrt(disc)) / 2, 0], [(-d - Math.sqrt(disc)) / 2, 0]]
    : [[-d / 2, Math.sqrt(-disc) / 2], [-d / 2, -Math.sqrt(-disc) / 2]];

  // x'' + d x' + x = 1 from rest, integrated with RK4.
  const f = ([x, v]) => [v, 1 - d * v - x];
  const add = (a, b, h) => a.map((ai, i) => ai + h * b[i]);
  const dt = 0.02, t = [0], x = [0];
  let s = [0, 0];
  for (let i = 1; i <= 1000; i++) {
    const k1 = f(s), k2 = f(add(s, k1, dt / 2)), k3 = f(add(s, k2, dt / 2)), k4 = f(add(s, k3, dt));
    s = s.map((si, j) => si + (dt / 6) * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j]));
    t.push(i * dt); x.push(s[0]);
  }
  return { poles, t, x };
}

function draw(p) {
  const { poles, t, x } = model(p);
  const c = theme();
  const re = poles[0][0];
  const verdict = re < -1e-9 ? "asymptotically stable" : re > 1e-9 ? "unstable" : "marginally stable";
  const fmt = ([a, b]) => a.toFixed(2) + (Math.abs(b) > 1e-9 ? (b > 0 ? " + " : " − ") + Math.abs(b).toFixed(2) + "i" : "");
  document.getElementById("readout").textContent = `poles: ${fmt(poles[0])} and ${fmt(poles[1])}  →  ${verdict}`;

  Plotly.react("plot-a", [{
    x: poles.map(q => q[0]), y: poles.map(q => q[1]), mode: "markers", name: "poles",
    marker: { symbol: "x-thin", size: 14, line: { width: 3, color: c.s1 } },
    hovertemplate: "Re %{x:.2f}, Im %{y:.2f}<extra></extra>",
  }], layout(c, { xaxis: { title: { text: "Re" }, range: [-3, 1.5] }, yaxis: { title: { text: "Im" }, range: [-1.6, 1.6] } }), CONFIG);

  Plotly.react("plot-b", [{
    x: t, y: x, mode: "lines", name: "x(t)", line: { width: 2, color: c.s1 },
    hovertemplate: "t = %{x:.1f}, x = %{y:.2f}<extra></extra>",
  }], layout(c, { xaxis: { title: { text: "t" }, range: [0, 20] }, yaxis: { title: { text: "x" }, range: [-1, 3] } }), CONFIG);
}

// ---- Plumbing: usually left as it is. ----
const CONFIG = { displayModeBar: false, responsive: true };

function theme() {
  const v = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return { text: v("--text"), muted: v("--muted"), grid: v("--grid"), axis: v("--axis"),
           s1: v("--series-1"), s2: v("--series-2"), s3: v("--series-3") };
}

// layout(c, axes, { equal: true })      equal scale on both axes, for anything geometric
// layout(c, axes, { arrows: [arrow()] }) arrows drawn in data coordinates
function layout(c, axes, { equal = false, arrows = [] } = {}) {
  const axis = a => ({ gridcolor: c.grid, zerolinecolor: c.muted, zerolinewidth: 1.5, linecolor: c.axis, tickfont: { color: c.muted }, ...a,
                       title: { ...a.title, font: { color: c.muted } } });
  const yaxis = axis(axes.yaxis);
  if (equal) Object.assign(yaxis, { scaleanchor: "x", scaleratio: 1, constrain: "domain" });
  return { paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", font: { color: c.text },
           margin: { l: 50, r: 16, t: 12, b: 44 }, showlegend: false,
           xaxis: axis(axes.xaxis), yaxis, annotations: arrows };
}

// An arrow from [x0, y0] to [x1, y1] in data coordinates. Label it in the text around the
// plot, in plain characters: combining marks such as a dot over a letter render badly here.
function arrow([x0, y0], [x1, y1], color) {
  return { x: x1, y: y1, ax: x0, ay: y0, xref: "x", yref: "y", axref: "x", ayref: "y",
           showarrow: true, arrowhead: 2, arrowsize: 1.2, arrowwidth: 2.5, arrowcolor: color, text: "" };
}

// Slider start values can be set in the URL (page.html?d=0.2), which is how to screenshot
// the page at a particular setting.
const query = new URLSearchParams(location.search);
const state = Object.fromEntries(PARAMS.map(p => [p.id, query.has(p.id) ? Number(query.get(p.id)) : p.value]));
for (const p of PARAMS) {
  const label = document.createElement("label");
  const digits = (String(p.step).split(".")[1] || "").length;
  label.innerHTML = `<span>${p.label} = <output>${state[p.id].toFixed(digits)}</output></span>
    <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${state[p.id]}">`;
  label.querySelector("input").addEventListener("input", e => {
    state[p.id] = Number(e.target.value);
    label.querySelector("output").textContent = state[p.id].toFixed(digits);
    draw(state);
  });
  document.getElementById("controls").append(label);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw(state));
draw(state);
</script>
</body>
</html>
